# ALSA configuration for a Fairphone 3 firmware using fairphone3_extras.
# Goes in the firmware's rootfs_overlay/etc/asound.conf.

# Playback goes through a software volume control ("Master") so the
# volume is applied in alsa-lib. Fairphone3Extras.Volume sets it with
# amixer. The control appears the first time the device is opened.
pcm.!default {
  type plug
  slave.pcm "softvol"
}

pcm.softvol {
  type softvol
  slave.pcm "hw:0,0"
  control {
    name "Master"
    card 0
  }
  min_dB -60.0
  max_dB 0.0
}

ctl.!default {
  type hw
  card 0
}

# The microphone: ALSA device "mic" (e.g. `arecord -D mic -c 1 -r 16000`),
# defined in a file Fairphone3Extras.Mic writes under its state_dir, as
# the card's capture device (hw:0,1) has to be opened with exactly as many
# channels as the mixer routes codec mic ports into it. Loaded as a hook
# so that the file's absence (before the app has written it) is not an
# error. Change the path if state_dir is configured differently.
@hooks [
  {
    func load
    files [ "/data/fairphone3_extras/asound.mic.conf" ]
    errors false
  }
]
