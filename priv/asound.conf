# ALSA configuration for a Fairphone 3 firmware using fp3_extras.
# Goes in the firmware's rootfs_overlay/etc/asound.conf.

# Playback through a software volume control ("Master"), set by
# Fp3Extras.Volume. The control appears the first time the device opens.
pcm.!default {
  type plug
  slave.pcm "softvol"
}

pcm.softvol {
  type softvol
  slave.pcm "hw:0,0"
  control {
    name "Master"
    card 0
  }
  min_dB -60.0
  max_dB 0.0
}

ctl.!default {
  type hw
  card 0
}

# ALSA device "mic", written by Fp3Extras.Mic under its state_dir with the
# channel count the mixer routes into hw:0,1. A hook, so its absence is fine.
@hooks [
  {
    func load
    files [ "/data/fp3_extras/asound.mic.conf" ]
    errors false
  }
]
